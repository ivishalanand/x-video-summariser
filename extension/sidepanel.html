<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>x summariser</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0d0d0d; color: #e8e8e8; font-family: 'JetBrains Mono', Menlo, monospace; }
    .status { padding: 24px; font-size: 13px; line-height: 1.6; color: #888; }
    .status .accent { color: #f5a623; }
    .status .err { color: #ff6b6b; }
    .status code { background: #1e1e1e; padding: 2px 6px; }
    iframe { width: 100%; height: 100vh; border: 0; display: block; background: #0d0d0d; }
    .hidden { display: none; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #f5a623; margin-right: 8px; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div id="status" class="status"><span class="dot"></span>starting backend...</div>
  <iframe id="app" class="hidden" allow="clipboard-write"></iframe>
  <script src="sidepanel.js"></script>
</body>
</html>
