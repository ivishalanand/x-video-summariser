<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vid summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #0d0d0d;
      --bg-soft: #161616;
      --bg-softer: #1e1e1e;
      --fg: #e8e8e8;
      --fg-dim: #888;
      --fg-dimmer: #555;
      --accent: #f5a623;
      --error: #ff6b6b;
      --mono: 'JetBrains Mono', 'Menlo', monospace;
      --sans: 'Inter', 'DM Sans', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 64px 24px;
    }
    main { width: 100%; max-width: 720px; }

    .title {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 500;
      color: var(--fg-dim);
      letter-spacing: 0.04em;
      margin-bottom: 40px;
    }
    .title .glyph { margin-right: 8px; }
    .title .accent { color: var(--accent); }

    .form {
      display: flex;
      gap: 12px;
      flex-direction: column;
    }
    .url-input {
      background: var(--bg-soft);
      border: none;
      color: var(--fg);
      font-family: var(--mono);
      font-size: 14px;
      padding: 16px 18px;
      width: 100%;
      outline: none;
      caret-color: var(--accent);
    }
    .url-input:focus { background: var(--bg-softer); }
    .url-input::placeholder { color: var(--fg-dimmer); }
    .url-input:disabled { opacity: 0.5; cursor: not-allowed; }

    .submit {
      align-self: flex-start;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 22px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .submit:hover:not(:disabled) { background: var(--accent); color: var(--bg); }
    .submit:disabled { opacity: 0.4; cursor: not-allowed; }

    .section-label {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: lowercase;
      letter-spacing: 0.08em;
      color: var(--fg-dimmer);
      margin: 36px 0 12px;
    }
    .section-label::before { content: '── '; }

    .progress { display: none; }
    .progress.active { display: block; }
    .steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-family: var(--mono);
      font-size: 13px;
    }
    .step { color: var(--fg-dimmer); }
    .step.active { color: var(--accent); }
    .step.done { color: var(--fg); }
    .step .marker { display: inline-block; width: 1.8em; }
    .step .cursor { color: var(--accent); animation: blink 1s steps(1) infinite; display: none; }
    .step.active .cursor { display: inline; }
    @keyframes blink { 50% { opacity: 0; } }

    .dl-bar, .tx-bar {
      height: 4px;
      background: var(--bg-softer);
      margin: 8px 0 0 1.8em;
      overflow: hidden;
      display: none;
    }
    .dl-bar.show, .tx-bar.show { display: block; }
    .dl-fill, .tx-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.18s linear;
    }
    .dl-meta, .tx-meta {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg-dim);
      margin: 4px 0 0 1.8em;
      display: none;
    }
    .dl-meta.show, .tx-meta.show { display: block; }

    .block {
      position: relative;
      background: var(--bg-soft);
      padding: 18px 20px;
      font-size: 14px;
      line-height: 1.6;
    }
    .block .copy {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: 1px solid var(--fg-dimmer);
      color: var(--fg-dim);
      font-family: var(--mono);
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      opacity: 1;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .block .copy:hover { color: var(--accent); border-color: var(--accent); }
    .block .copy.copied { color: var(--accent); border-color: var(--accent); }
    .summary-text { font-family: var(--sans); white-space: pre-wrap; }
    .transcript-text {
      font-family: var(--mono);
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--bg-softer);
      margin-top: 36px;
    }
    .tab {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--fg-dimmer);
      font-family: var(--mono);
      font-size: 11px;
      text-transform: lowercase;
      letter-spacing: 0.08em;
      padding: 8px 16px 10px;
      cursor: pointer;
      transition: color 0.12s ease, border-color 0.12s ease;
      margin-bottom: -1px;
    }
    .tab:hover { color: var(--fg-dim); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-panel { display: none; margin-top: 12px; }
    .tab-panel.active { display: block; }

    .error {
      color: var(--error);
      font-family: var(--mono);
      font-size: 13px;
      display: none;
      margin-top: 4px;
    }
    .error.show { display: block; }
    .duration {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg-dimmer);
      margin-top: 8px;
    }
    .warn {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      margin-top: 8px;
      display: none;
    }
    .warn.show { display: block; }

    .result-section { display: none; }
    .result-section.show { display: block; }

    .chat-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .chat-suggestions.hidden { display: none; }
    .suggest-chip {
      background: var(--bg-soft);
      border: 1px solid transparent;
      color: var(--fg-dim);
      font-family: var(--mono);
      font-size: 12px;
      padding: 6px 12px;
      cursor: pointer;
      transition: color 0.12s ease, border-color 0.12s ease;
    }
    .suggest-chip:hover { color: var(--accent); border-color: var(--accent); }
    .suggest-chip:disabled { opacity: 0.4; cursor: not-allowed; }

    .chat-thread {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }
    .chat-msg {
      background: var(--bg-soft);
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }
    .chat-msg.user { background: var(--bg-softer); }
    .chat-msg.user .content { white-space: pre-wrap; }
    .chat-msg.assistant .content > *:first-child { margin-top: 0; }
    .chat-msg.assistant .content > *:last-child { margin-bottom: 0; }
    .chat-msg.assistant .content p { margin: 8px 0; }
    .chat-msg.assistant .content ul,
    .chat-msg.assistant .content ol { margin: 8px 0; padding-left: 22px; }
    .chat-msg.assistant .content li { margin: 3px 0; }
    .chat-msg.assistant .content h1,
    .chat-msg.assistant .content h2,
    .chat-msg.assistant .content h3,
    .chat-msg.assistant .content h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--fg);
      margin: 12px 0 4px;
    }
    .chat-msg.assistant .content code {
      background: var(--bg-softer);
      padding: 1px 6px;
      font-family: var(--mono);
      font-size: 12.5px;
    }
    .chat-msg.assistant .content pre {
      background: var(--bg-softer);
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .chat-msg.assistant .content pre code {
      background: transparent;
      padding: 0;
      font-size: 12.5px;
    }
    .chat-msg.assistant .content a {
      color: var(--accent);
      text-decoration: underline;
    }
    .chat-msg.assistant .content blockquote {
      border-left: 2px solid var(--fg-dimmer);
      padding-left: 12px;
      color: var(--fg-dim);
      margin: 8px 0;
    }
    .chat-msg.assistant .content strong { color: var(--fg); font-weight: 600; }
    .chat-msg.assistant .content hr {
      border: none;
      border-top: 1px solid var(--bg-softer);
      margin: 12px 0;
    }
    .chat-msg .role {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--fg-dimmer);
      margin-bottom: 6px;
      text-transform: lowercase;
    }
    .chat-msg.user .role { color: var(--accent); }
    .chat-msg.assistant .content::after {
      content: '▋';
      color: var(--accent);
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
      display: none;
    }
    .chat-msg.assistant.streaming .content::after { display: inline; }
    .chat-msg.assistant.error .content { color: var(--error); }

    .chat-form {
      display: flex;
      gap: 8px;
      position: sticky;
      bottom: 16px;
      background: var(--bg);
      padding: 12px 0 0;
      z-index: 10;
    }
    .chat-form::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: -16px;
      height: 16px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none;
    }
    .chat-input {
      flex: 1;
      background: var(--bg-soft);
      border: none;
      color: var(--fg);
      font-family: var(--sans);
      font-size: 14px;
      padding: 12px 16px;
      outline: none;
      caret-color: var(--accent);
    }
    .chat-input:focus { background: var(--bg-softer); }
    .chat-input:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-send {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 0 18px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .chat-send:hover:not(:disabled) { background: var(--accent); color: var(--bg); }
    .chat-send:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <main>
    <div class="title">
      <span class="glyph">🎬</span>vid <span class="accent">summarizer</span>
    </div>

    <form class="form" id="form" autocomplete="off">
      <input
        type="url"
        class="url-input"
        id="url"
        placeholder="paste twitter/x url here..."
        autocomplete="off"
        spellcheck="false"
        required>
      <button type="submit" class="submit" id="submit">summarize</button>
      <div class="error" id="error"></div>
      <div class="warn" id="warn"></div>
    </form>

    <div class="progress" id="progress">
      <div class="section-label">progress</div>
      <div class="steps">
        <div class="step" data-step="downloading">
          <span class="marker"></span>downloading<span class="cursor"> _</span>
          <div class="dl-bar" id="dl-bar"><div class="dl-fill" id="dl-fill"></div></div>
          <div class="dl-meta" id="dl-meta"></div>
        </div>
        <div class="step" data-step="transcribing">
          <span class="marker"></span>transcribing<span class="cursor"> _</span>
          <div class="tx-bar" id="tx-bar"><div class="tx-fill" id="tx-fill"></div></div>
          <div class="tx-meta" id="tx-meta"></div>
        </div>
        <div class="step" data-step="summarizing">
          <span class="marker"></span>summarizing<span class="cursor"> _</span>
        </div>
      </div>
    </div>

    <div class="result-section" id="result-tabs-section">
      <div class="tabs">
        <button class="tab active" data-tab="summary">summary</button>
        <button class="tab" data-tab="transcript">transcript</button>
      </div>
      <div class="tab-panel active" data-panel="summary">
        <div class="block">
          <button class="copy" data-target="summary-text" type="button">copy</button>
          <div class="summary-text" id="summary-text"></div>
        </div>
        <div class="duration" id="duration"></div>
      </div>
      <div class="tab-panel" data-panel="transcript">
        <div class="block">
          <button class="copy" data-target="transcript-text" type="button">copy</button>
          <div class="transcript-text" id="transcript-text"></div>
        </div>
      </div>
    </div>

    <div class="result-section" id="chat-section">
      <div class="section-label">chat</div>
      <div class="chat-suggestions" id="chat-suggestions">
        <button class="suggest-chip" type="button" data-q="What are the key takeaways?">key takeaways</button>
        <button class="suggest-chip" type="button" data-q="Explain this simply, like I'm new to the topic.">explain simply</button>
        <button class="suggest-chip" type="button" data-q="What is the speaker's main argument and what evidence do they give?">main argument</button>
      </div>
      <div class="chat-thread" id="chat-thread"></div>
      <form class="chat-form" id="chat-form" autocomplete="off">
        <input type="text" class="chat-input" id="chat-input" placeholder="ask a follow-up..." autocomplete="off">
        <button type="submit" class="chat-send" id="chat-send">send</button>
      </form>
    </div>
  </main>

  <script>
    const URL_PATTERNS = [
      /^https:\/\/(?:www\.)?x\.com\/[^/]+\/status\/\d+(?:[/?].*)?$/i,
      /^https:\/\/(?:www\.)?twitter\.com\/[^/]+\/status\/\d+(?:[/?].*)?$/i,
      /^https:\/\/t\.co\/[A-Za-z0-9_-]+$/i,
    ];

    const form = document.getElementById('form');
    const urlInput = document.getElementById('url');
    const submitBtn = document.getElementById('submit');
    const errorEl = document.getElementById('error');
    const warnEl = document.getElementById('warn');
    const progressEl = document.getElementById('progress');
    const resultTabsSection = document.getElementById('result-tabs-section');
    const summaryText = document.getElementById('summary-text');
    const durationEl = document.getElementById('duration');
    const transcriptText = document.getElementById('transcript-text');

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === name));
    }
    resultTabsSection.addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (tab) switchTab(tab.dataset.tab);
    });
    const dlBar = document.getElementById('dl-bar');
    const dlFill = document.getElementById('dl-fill');
    const dlMeta = document.getElementById('dl-meta');
    const txBar = document.getElementById('tx-bar');
    const txFill = document.getElementById('tx-fill');
    const txMeta = document.getElementById('tx-meta');
    const chatSection = document.getElementById('chat-section');
    const chatSuggestions = document.getElementById('chat-suggestions');
    const chatThread = document.getElementById('chat-thread');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');

    let chatMessages = [];
    let currentTranscript = '';
    let chatBusy = false;

    if (window.marked) marked.setOptions({ breaks: true, gfm: true });
    function renderMarkdownInto(el, text) {
      if (!window.marked || !window.DOMPurify) {
        el.textContent = text;
        return;
      }
      const html = marked.parse(text);
      const frag = DOMPurify.sanitize(html, { RETURN_DOM_FRAGMENT: true });
      el.replaceChildren(frag);
    }

    const STEPS = ['downloading', 'transcribing', 'summarizing'];

    const isValidUrl = (u) => URL_PATTERNS.some((p) => p.test(u.trim()));

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('show');
    }
    function clearError() {
      errorEl.textContent = '';
      errorEl.classList.remove('show');
    }
    function clearWarn() {
      warnEl.textContent = '';
      warnEl.classList.remove('show');
    }

    function resetSteps() {
      document.querySelectorAll('.step').forEach((el) => {
        el.classList.remove('active', 'done');
        el.querySelector('.marker').textContent = '';
      });
      dlBar.classList.remove('show');
      dlMeta.classList.remove('show');
      dlFill.style.width = '0%';
      dlMeta.textContent = '';
      txBar.classList.remove('show');
      txMeta.classList.remove('show');
      txFill.style.width = '0%';
      txMeta.textContent = '';
    }

    function formatSeconds(s) {
      if (s == null) return '';
      const sec = Math.round(s);
      if (sec < 60) return `${sec}s`;
      const m = Math.floor(sec / 60);
      const r = sec % 60;
      return r ? `${m}m ${r}s` : `${m}m`;
    }

    function handleTranscribeProgress(p) {
      txBar.classList.add('show');
      txMeta.classList.add('show');
      const pct = typeof p.percent === 'number' ? Math.min(100, p.percent) : 0;
      txFill.style.width = `${pct.toFixed(1)}%`;
      const parts = [];
      if (p.current != null && p.total) {
        parts.push(`${formatSeconds(p.current)} / ${formatSeconds(p.total)}`);
      }
      if (typeof p.percent === 'number') parts.push(`${p.percent.toFixed(1)}%`);
      txMeta.textContent = parts.join(' · ');
    }

    function formatBytes(n) {
      if (n == null) return '?';
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / 1024 / 1024).toFixed(2)} MB`;
    }

    function handleDownloadProgress(p) {
      dlBar.classList.add('show');
      dlMeta.classList.add('show');
      const pct = typeof p.percent === 'number' ? Math.min(100, p.percent) : 0;
      dlFill.style.width = `${pct.toFixed(1)}%`;
      if (p.phase === 'extracting') {
        dlMeta.textContent = 'extracting audio...';
        return;
      }
      const parts = [];
      if (p.total != null) {
        parts.push(`${formatBytes(p.downloaded)} / ${formatBytes(p.total)}`);
      } else if (p.downloaded) {
        parts.push(formatBytes(p.downloaded));
      }
      if (typeof p.percent === 'number') parts.push(`${p.percent.toFixed(1)}%`);
      if (p.speed) parts.push(`${formatBytes(p.speed)}/s`);
      dlMeta.textContent = parts.join(' · ');
    }

    function setStep(name, state) {
      const el = document.querySelector(`.step[data-step="${name}"]`);
      if (!el) return;
      el.classList.remove('active', 'done');
      const marker = el.querySelector('.marker');
      if (state === 'active') {
        el.classList.add('active');
        marker.textContent = '◌ ';
      } else if (state === 'done') {
        el.classList.add('done');
        marker.textContent = '✓ ';
      }
    }

    function advanceTo(step) {
      const idx = STEPS.indexOf(step);
      if (idx < 0) return;
      for (let i = 0; i < idx; i++) setStep(STEPS[i], 'done');
      setStep(step, 'active');
    }

    function setRunning(running) {
      submitBtn.disabled = running;
      urlInput.disabled = running;
      submitBtn.textContent = running ? 'working...' : 'summarize';
    }

    function formatDuration(s) {
      if (!s) return '';
      const sec = Math.round(s);
      if (sec < 60) return `${sec}s`;
      const m = Math.floor(sec / 60);
      const r = sec % 60;
      return r ? `${m}m ${r}s` : `${m}m`;
    }

    function handleDone(payload) {
      STEPS.forEach((s) => setStep(s, 'done'));
      summaryText.textContent = payload.summary || '';
      durationEl.textContent = payload.duration_seconds
        ? `video duration: ${formatDuration(payload.duration_seconds)}`
        : '';
      transcriptText.textContent = payload.transcript || '(no transcript)';
      resultTabsSection.classList.add('show');
      switchTab('summary');

      currentTranscript = payload.transcript || '';
      chatMessages = [];
      chatThread.replaceChildren();
      chatSuggestions.classList.remove('hidden');
      if (currentTranscript) {
        chatSection.classList.add('show');
      } else {
        chatSection.classList.remove('show');
      }
    }

    function appendChatMessage(role, initialText) {
      const wrap = document.createElement('div');
      wrap.className = `chat-msg ${role}`;
      const roleEl = document.createElement('div');
      roleEl.className = 'role';
      roleEl.textContent = role === 'user' ? 'you' : 'claude';
      const contentEl = document.createElement('div');
      contentEl.className = 'content';
      contentEl.textContent = initialText || '';
      wrap.append(roleEl, contentEl);
      chatThread.append(wrap);
      wrap.scrollIntoView({ block: 'end' });
      return { wrap, contentEl };
    }

    function setChatBusy(busy) {
      chatBusy = busy;
      chatInput.disabled = busy;
      chatSend.disabled = busy;
      chatSend.textContent = busy ? '...' : 'send';
      document.querySelectorAll('.suggest-chip').forEach((b) => { b.disabled = busy; });
    }

    async function streamChat(contentEl, wrap) {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },
        body: JSON.stringify({ transcript: currentTranscript, messages: chatMessages }),
      });
      if (!resp.ok || !resp.body) throw new Error(`server error (${resp.status})`);
      wrap.classList.add('streaming');
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let full = '';
      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let sep;
          while ((sep = buf.indexOf('\n\n')) >= 0) {
            const chunk = buf.slice(0, sep);
            buf = buf.slice(sep + 2);
            for (const line of chunk.split('\n')) {
              if (!line.startsWith('data:')) continue;
              const raw = line.slice(5).trim();
              if (!raw) continue;
              let payload;
              try { payload = JSON.parse(raw); } catch { continue; }
              if (payload.type === 'token') {
                full += payload.text;
                renderMarkdownInto(contentEl, full);
                wrap.scrollIntoView({ block: 'end' });
              } else if (payload.type === 'done') {
                return full;
              } else if (payload.type === 'error') {
                throw new Error(payload.message);
              }
            }
          }
        }
      } finally {
        wrap.classList.remove('streaming');
      }
      return full;
    }

    async function sendChat(question) {
      const q = question.trim();
      if (chatBusy || !q || !currentTranscript) return;
      chatSuggestions.classList.add('hidden');
      chatMessages.push({ role: 'user', content: q });
      appendChatMessage('user', q);
      const { wrap, contentEl } = appendChatMessage('assistant', '');
      setChatBusy(true);
      try {
        const reply = await streamChat(contentEl, wrap);
        if (reply) {
          chatMessages.push({ role: 'assistant', content: reply });
        } else {
          wrap.classList.add('error');
          contentEl.textContent = '[empty response]';
          chatMessages.pop();
        }
      } catch (err) {
        wrap.classList.add('error');
        contentEl.textContent = `[error] ${err.message || 'something went wrong'}`;
        chatMessages.pop();
      } finally {
        setChatBusy(false);
        chatInput.value = '';
        chatInput.focus();
      }
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      sendChat(chatInput.value);
    });

    chatSuggestions.addEventListener('click', (e) => {
      const btn = e.target.closest('.suggest-chip');
      if (!btn) return;
      sendChat(btn.dataset.q || btn.textContent);
    });

    document.body.addEventListener('click', async (e) => {
      const btn = e.target.closest('.copy');
      if (!btn) return;
      const target = document.getElementById(btn.dataset.target);
      if (!target) return;
      try {
        await navigator.clipboard.writeText(target.textContent);
        const orig = btn.textContent;
        btn.textContent = 'copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1200);
      } catch {
        btn.textContent = 'failed';
      }
    });

    async function streamSummarize(url) {
      const resp = await fetch('/summarize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },
        body: JSON.stringify({ url }),
      });
      if (!resp.ok || !resp.body) {
        throw new Error(`server error (${resp.status})`);
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let sep;
        while ((sep = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, sep);
          buf = buf.slice(sep + 2);
          for (const line of chunk.split('\n')) {
            if (!line.startsWith('data:')) continue;
            const raw = line.slice(5).trim();
            if (!raw) continue;
            let payload;
            try { payload = JSON.parse(raw); } catch { continue; }
            if (payload.type === 'progress') {
              advanceTo(payload.step);
            } else if (payload.type === 'download_progress') {
              handleDownloadProgress(payload);
            } else if (payload.type === 'transcribe_progress') {
              handleTranscribeProgress(payload);
            } else if (payload.type === 'warn') {
              warnEl.textContent = payload.message;
              warnEl.classList.add('show');
            } else if (payload.type === 'done') {
              handleDone(payload);
              return;
            } else if (payload.type === 'error') {
              throw new Error(payload.message);
            }
          }
        }
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      clearWarn();

      const url = urlInput.value.trim();
      if (!isValidUrl(url)) {
        showError('please enter a valid twitter/x status URL');
        return;
      }

      resetSteps();
      resultTabsSection.classList.remove('show');
      switchTab('summary');
      chatSection.classList.remove('show');
      chatThread.replaceChildren();
      chatMessages = [];
      currentTranscript = '';
      progressEl.classList.add('active');
      setRunning(true);

      try {
        await streamSummarize(url);
      } catch (err) {
        showError(err.message || 'something went wrong');
      } finally {
        setRunning(false);
        document.querySelectorAll('.step.active').forEach((el) => {
          el.classList.remove('active');
        });
      }
    });
  </script>
</body>
</html>
